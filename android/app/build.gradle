apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    // ✅ FIX 1: Explicitly set NDK r27 for 16KB page size support
    ndkVersion "27.1.12297006"
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.cardio"
    defaultConfig {
        applicationId "com.advancetelesensor.cardio"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 223
        versionName "2.1.34"
    }

    splits {
        abi {
            reset()
            enable true
            universalApk true
            include "armeabi-v7a", "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig (project.hasProperty('MYAPP_UPLOAD_STORE_FILE') ? signingConfigs.release : signingConfigs.debug)
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    // ✅ FIX 2: Disable legacy .so packaging so libs are properly 16KB-aligned
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                '/META-INF/DEPENDENCIES',
                '/META-INF/LICENSE',
                '/META-INF/LICENSE.txt',
                '/META-INF/license.txt',
                '/META-INF/NOTICE',
                '/META-INF/NOTICE.txt',
                '/META-INF/notice.txt',
                '/META-INF/ASL2.0',
                '/META-INF/INDEX.LIST'
            ]
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation ("com.facebook.fresco:animated-gif:3.1.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)

// Only bundle the vector icon fonts actually used by the app
project.ext.vectoricons = [
    iconFontNames: [
        'AntDesign.ttf',
        'Entypo.ttf',
        'Feather.ttf',
        'FontAwesome.ttf',
        'FontAwesome5_Brands.ttf',
        'FontAwesome5_Regular.ttf',
        'FontAwesome5_Solid.ttf',
        'Fontisto.ttf',
        'Ionicons.ttf',
        'MaterialIcons.ttf'
    ]
]
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.firebase-perf'

// =============================================================================
// 16 KB Memory Page Size Support (Google Play / Android 15+)
// =============================================================================
tasks.configureEach { task ->
    // Hook 1: Patch ELF PT_LOAD alignment for merged and stripped native libs
    if ((task.name.startsWith('merge') && task.name.endsWith('NativeLibs')) ||
        (task.name.startsWith('strip') && task.name.endsWith('DebugSymbols'))) {
        task.doLast {
            def patchScript = file("${rootProject.projectDir}/../scripts/patch_elf_16kb.py")
            if (!patchScript.exists()) return

            def dirsToScan = [
                file("${buildDir}/intermediates/merged_native_libs"),
                file("${buildDir}/intermediates/stripped_native_libs")
            ]

            dirsToScan.each { baseDir ->
                if (baseDir.exists()) {
                    exec {
                        commandLine 'python3', patchScript.absolutePath, baseDir.absolutePath
                    }
                }
            }
        }
    }

    // Hook 2: Patch AAB BundleConfig.pb and re-sign with jarsigner
    if (task.name == 'bundleRelease') {
        task.doLast {
            def bundleDir = file("${buildDir}/outputs/bundle/release")
            def aabFile = file("${bundleDir}/app-release.aab")

            if (aabFile.exists()) {
                def patchScript = file("${rootProject.projectDir}/../scripts/patch_bundleconfig_16kb.py")
                def patchedTmp = file("${aabFile.parent}/_patched_tmp.aab")
                println "16KB AAB: patching BundleConfig.pb..."
                exec { commandLine 'python3', patchScript.absolutePath, aabFile.absolutePath, patchedTmp.absolutePath }
                aabFile.delete()
                patchedTmp.renameTo(aabFile)

                def jarsignerBin = "jarsigner"
                try {
                    def jHome = System.getenv("JAVA_HOME") ?: (org.gradle.internal.jvm.Jvm.current()?.javaHome?.absolutePath)
                    if (jHome && file("${jHome}/bin/jarsigner").exists()) {
                        jarsignerBin = file("${jHome}/bin/jarsigner").absolutePath
                    }
                } catch (Exception ignored) {}

                if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                    println "16KB AAB: re-signing with upload keystore..."
                    exec {
                        commandLine jarsignerBin,
                            '-keystore', file(MYAPP_UPLOAD_STORE_FILE).absolutePath,
                            '-storepass', MYAPP_UPLOAD_STORE_PASSWORD,
                            '-keypass', MYAPP_UPLOAD_KEY_PASSWORD,
                            aabFile.absolutePath,
                            MYAPP_UPLOAD_KEY_ALIAS
                    }
                } else if (file('debug.keystore').exists()) {
                    println "16KB AAB: re-signing with debug keystore..."
                    exec {
                        commandLine jarsignerBin,
                            '-keystore', file('debug.keystore').absolutePath,
                            '-storepass', 'android',
                            '-keypass', 'android',
                            aabFile.absolutePath,
                            'androiddebugkey'
                    }
                }
                println "16KB AAB: successfully configured for 16KB -> ${aabFile.name}"
            }
        }
    }

    // Hook 3: APK 16KB zipalign and re-sign with apksigner (for Universal APK & split APKs)
    if (task.name in ['packageUniversalRelease', 'packageRelease', 'assembleRelease', 'assembleUniversalRelease']) {
        task.doLast {
            def apkBaseDir = file("${buildDir}/outputs/apk")
            if (!apkBaseDir.exists()) return

            def zipalignBin = "zipalign"
            def apksignerBin = "apksigner"
            try {
                def sdk = android.sdkDirectory?.absolutePath
                def bt = android.buildToolsVersion
                if (sdk && bt) {
                    def z = file("${sdk}/build-tools/${bt}/zipalign")
                    def a = file("${sdk}/build-tools/${bt}/apksigner")
                    if (z.exists()) zipalignBin = z.absolutePath
                    if (a.exists()) apksignerBin = a.absolutePath
                }
            } catch (Exception ignored) {}

            def releaseApks = fileTree(dir: apkBaseDir, include: '**/*release*.apk').files.findAll {
                !it.name.contains('-16k') && !it.name.contains('androidTest')
            }

            releaseApks.each { apkFile ->
                def alignedFile = file("${apkFile.parent}/${apkFile.name.replace('.apk', '-16k.apk')}")
                try {
                    println "16KB APK: zipalign -P 16 for ${apkFile.name}..."
                    exec {
                        commandLine zipalignBin, '-f', '-P', '16', '4', apkFile.absolutePath, alignedFile.absolutePath
                    }
                    apkFile.delete()
                    alignedFile.renameTo(apkFile)

                    if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                        println "16KB APK: re-signing ${apkFile.name} with upload keystore..."
                        exec {
                            commandLine apksignerBin, 'sign',
                                '--ks', file(MYAPP_UPLOAD_STORE_FILE).absolutePath,
                                '--ks-pass', "pass:${MYAPP_UPLOAD_STORE_PASSWORD}",
                                '--ks-key-alias', MYAPP_UPLOAD_KEY_ALIAS,
                                '--key-pass', "pass:${MYAPP_UPLOAD_KEY_PASSWORD}",
                                apkFile.absolutePath
                        }
                    } else if (file('debug.keystore').exists()) {
                        println "16KB APK: re-signing ${apkFile.name} with debug keystore..."
                        exec {
                            commandLine apksignerBin, 'sign',
                                '--ks', file('debug.keystore').absolutePath,
                                '--ks-pass', 'pass:android',
                                '--ks-key-alias', 'androiddebugkey',
                                '--key-pass', 'pass:android',
                                apkFile.absolutePath
                        }
                    }
                    println "16KB APK: successfully aligned & signed -> ${apkFile.name}"
                } catch (Exception e) {
                    println "16KB APK notice for ${apkFile.name}: ${e.message}"
                }
            }
        }
    }
}


